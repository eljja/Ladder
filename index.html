<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cylinder Ladder 3D - 원통형 3D 사다리 게임</title>
  <meta name="description" content="360도 원통형 구조로 공평하게 즐기는 3D 사다리 게임" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>
<body>
  <div id="app">
    <!-- 3D Canvas -->
    <div id="canvas-container">
      <canvas id="three-canvas"></canvas>
    </div>

    <!-- Header -->
    <header class="top-header">
      <div class="title-group">
        <h1>Cylinder Ladder 3D</h1>
        <span class="badge">100% Fair</span>
      </div>
    </header>

    <!-- Floating Interactive Hint -->
    <div class="interactive-hint">
      💡 <span class="highlight">마블 클릭 후 Ctrl+V</span>로 얼굴 사진을 넣을 수 있습니다! 기둥 사이를 드래그하여 다리를 연결하세요.
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <button type="button" id="btnStartSimul" class="btn-primary" title="모든 참가자 마블 동시 출발">
        🚀 전체 동시 출발
      </button>
      <button type="button" id="btnModeToggle" class="btn-secondary" title="상단의 구슬을 직접 눌러 하나씩 출발">
        🎯 개별 터치 모드
      </button>
      <button type="button" id="btnQuickTopView" class="btn-secondary" title="완전 위에서 내려다보는 탑뷰 / 정면 뷰 전환">
        📐 탑뷰 전환
      </button>
      <button type="button" id="btnToggleCamLock" class="btn-secondary btn-cam-lock" title="경기 진행 중 카메라 자동 회전 및 이동 고정/해제">
        🔒 카메라 고정
      </button>
      <button type="button" id="btnReset" class="btn-sub" title="처음 위치로 되돌리기">
        🔄 다시하기
      </button>
    </div>

    <!-- Mobile Sidebar Toggle -->
    <button type="button" id="btnToggleSidebar" class="btn-toggle-sidebar" title="설정 메뉴 열기">☰</button>

    <!-- Sidebar Settings -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>⚙️ 사다리 설정</h2>
        <button type="button" id="btnCollapseSidebar" class="btn-sidebar-close" title="사이드바 접기">❯</button>
      </div>
      <div class="sidebar-content">
        <!-- 1. 참가자 명단 -->
        <div class="panel-box">
          <div class="box-header">
            <label for="in_names">👥 참가자 명단</label>
            <div class="preset-row">
              <select id="sltPreset" title="프리셋 선택"></select>
              <button type="button" id="btnSavePreset" class="btn-xs" title="현재 명단 저장">저장</button>
              <button type="button" id="btnDeletePreset" class="btn-xs btn-del" title="선택 프리셋 삭제">삭제</button>
            </div>
          </div>
          <textarea id="in_names" placeholder="쉼표(,) 또는 줄바꿈으로 구분">철수, 영희, 민수, 지우, 수빈, 동현</textarea>
          <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
            <button type="button" id="btnClearAllAvatars" class="btn-xs btn-del" style="background: #c62828; color: #fff; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px;" title="등록된 모든 마블 얼굴 사진 삭제">🗑️ 전체 사진 초기화</button>
          </div>
        </div>

        <!-- 2. 당첨/결과 항목 -->
        <div class="panel-box">
          <div class="box-header">
            <label for="in_goals">🎯 당첨/결과 항목</label>
          </div>
          <textarea id="in_goals" placeholder="각 기둥 하단에 배정될 결과 (쉼표 또는 줄바꿈)">짜장면, 김치찌개, 돈까스, 햄버거, 쌀국수, 초밥</textarea>
        </div>

        <!-- 3. 사다리 밀도 및 속도 -->
        <div class="panel-box">
          <div class="box-header">
            <label for="sliderDensity">🎲 다리 밀도 (개수)</label>
          </div>
          <div class="range-row">
            <span>적음</span>
            <input type="range" id="sliderDensity" min="2" max="6" step="0.5" value="3.5" />
            <span>많음</span>
          </div>
        </div>

        <!-- 3-1. 원근 / 하단 크기 조절 (테이퍼) -->
        <div class="panel-box">
          <div class="box-header">
            <label for="sliderTaper">📐 원근 / 하단 크기 조절</label>
            <button type="button" id="btnResetTaper" class="btn-text-sm" title="기본 원통 비율로 초기화">기본값 1.0x</button>
          </div>
          <div class="range-row">
            <span>아래 좁게</span>
            <input type="range" id="sliderTaper" min="0.2" max="1.8" step="0.05" value="1.0" />
            <span>아래 넓게</span>
          </div>
          <div class="taper-status-hint">
            현재: <span id="valTaper" class="highlight-val">1.00x (기본 원통형)</span>
          </div>
        </div>

        <div class="panel-box">
          <div class="box-header">
            <label>⚡ 진행 속도</label>
          </div>
          <div class="tools-grid" style="grid-template-columns: repeat(3, 1fr);">
            <button type="button" class="btn-speed active" data-speed="1.0">1x</button>
            <button type="button" class="btn-speed" data-speed="2.0">2x</button>
            <button type="button" class="btn-speed" data-speed="3.5">3.5x</button>
          </div>
        </div>

        <!-- 4. 테마 및 비주얼 -->
        <div class="panel-box">
          <div class="box-header">
            <label for="sltTheme">🎨 3D 테마 스킨</label>
          </div>
          <div class="select-row">
            <select id="sltTheme" class="full-width-select" title="사다리 3D 테마 스킨 선택">
              <option value="neon">🌌 사이버펑크 네온 (기본)</option>
              <option value="wooden">🪵 클래식 우든 타워</option>
              <option value="space">🚀 스페이스 코스믹</option>
            </select>
          </div>
          <div class="tools-grid" style="margin-top: 4px;">
            <button type="button" id="btnToggleTrail" class="active btn-span-2" title="마블이 지나간 길에 발광 궤적 표시">✨ 네온 트레일: ON</button>
          </div>
        </div>

        <!-- 5. 녹화 & 공유 -->
        <div class="panel-box">
          <div class="box-header">
            <label>📹 녹화 & 공유</label>
          </div>
          <div class="tools-grid">
            <button type="button" id="btnToggleRecord" title="경기 시작 시 자동 영상 녹화 및 종료 시 다운로드">📹 자동 녹화: OFF</button>
            <button type="button" id="btnShareUrl" title="현재 사다리 설정 링크 복사">🔗 사다리 링크 복사</button>
          </div>
        </div>

        <!-- 6. 도구 버튼 -->
        <div class="tools-grid">
          <button type="button" id="btnRandomize" title="새로운 무작위 다리 생성">🎲 랜덤 생성</button>
          <button type="button" id="btnClearBridges" title="모든 가로선 지우기">🧹 다리 비우기</button>
          <button type="button" id="btnToggleEdit" class="active" title="드래그 다리 그리기 활성/비활성">✏️ 그리기: ON</button>
          <button type="button" id="btnSound" title="효과음 켜기/끄기">🔊 효과음 ON</button>
          <button type="button" id="btnBgm" class="active" title="유튜브 배경음악 켜기/끄기">🎵 BGM ON</button>
          <button type="button" id="btnToggleView" title="정면 뷰 / 완전 탑뷰 전환">📐 뷰: 정면</button>
          <button type="button" id="btnToggleCamLockSidebar" class="btn-span-2" title="경기 진행 중 카메라 자동 회전 및 이동 고정/해제">🔒 카메라 고정: OFF (추적 중)</button>
        </div>
      </div>
    </aside>

    <!-- Result Modal -->
    <div id="resultModal" class="result-modal hide">
      <div class="result-modal-content">
        <div class="modal-header">
          <h3>🏆 사다리 추첨 결과</h3>
          <button type="button" id="btnCloseModal" class="btn-close" title="닫기">&times;</button>
        </div>
        <div id="resultList" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" id="btnCopyResult" class="btn-copy">📋 결과 텍스트 복사</button>
          <button type="button" id="btnNextRoundExclude" class="btn-exclude">⏭️ 당첨자 제외하고 다음 판 (서바이벌)</button>
          <button type="button" id="btnRestartSame" class="btn-restart">🔄 같은 명단으로 다시하기</button>
        </div>
      </div>
    </div>

    <!-- YouTube Background Music Player (Hidden) -->
    <div id="youtube-bgm-wrapper" style="position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; overflow: hidden; pointer-events: none; opacity: 0.001; z-index: -999;">
      <div id="youtube-bgm-player"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
